esphome:
  name: sauna
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
#  framework:
#    type: arduino


external_components:
  - source:
      type: local
      path: components

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret sauna_api_key

# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.7.249

binary_sensor:
  - platform: sauna
    running:
      name: "Sauna On"

sensor:
  - platform: uptime
    name: "Sauna Uptime"
  - platform: sauna
    id: sauna_panel
    current_temp:
      name: "Sauna Current Temp"
      unit_of_measurement: "°F"
      accuracy_decimals: 0
    setpoint_temp:
      name: "Sauna Setpoint Temp"
      unit_of_measurement: "°F"
      accuracy_decimals: 0
    timer:
      name: "Sauna Timer"
      unit_of_measurement: "min"
      accuracy_decimals: 0

button:
  - platform: template
    name: "Red Light"
    on_press:
      - lambda: |-
          id(sauna_panel).press_button(esphome::sauna::BUTTON_RED_LIGHT, 100);
  - platform: template
    name: "Temperature Up"
    on_press:
      - lambda: |-
          id(sauna_panel).press_button(esphome::sauna::BUTTON_TEMP_UP, 100);
  - platform: template
    name: "Temperature Down"
    on_press:
      - lambda: |-
          id(sauna_panel).press_button(esphome::sauna::BUTTON_TEMP_DOWN, 100);
  - platform: template
    name: "Timer Increase"
    on_press:
      - lambda: |-
          id(sauna_panel).press_button(esphome::sauna::BUTTON_TIMER_UP, 100);
  - platform: template
    name: "Timer Decrease"
    on_press:
      - lambda: |-
          id(sauna_panel).press_button(esphome::sauna::BUTTON_TIMER_DOWN, 100);
  - platform: template
    name: "Color Light"
    on_press:
      - lambda: |-
          id(sauna_panel).press_button(esphome::sauna::BUTTON_COLOR_LIGHT, 100);
  - platform: template
    name: "Power"
    on_press:
      - lambda: |-
          id(sauna_panel).press_button(esphome::sauna::BUTTON_POWER, 100);
